# CI — ProjetoJeofton (Node.js + React)
# Dispara em PR e push para main/develop (feedback antes do merge).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend — Build e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/user-service/package-lock.json
            backend/restaurant-service/package-lock.json
            backend/order-service/package-lock.json
            backend/api-gateway/package-lock.json

      - name: user-service — install, test, build
        working-directory: backend/user-service
        run: |
          npm ci
          npm run test:coverage
          npm run build

      - name: restaurant-service — install, test, build
        working-directory: backend/restaurant-service
        run: |
          npm ci
          npm run test:coverage
          npm run test:integration
          npm run build

      - name: order-service — install, test, build
        working-directory: backend/order-service
        run: |
          npm ci
          npm run test:coverage
          npm run build

      - name: api-gateway — install, build
        working-directory: backend/api-gateway
        run: |
          npm ci
          npm run build

      - name: Preparar LCOV para SonarCloud
        run: |
          mkdir -p coverage-reports
          cp backend/user-service/coverage/lcov.info coverage-reports/user-service-lcov.info
          cp backend/restaurant-service/coverage/lcov.info coverage-reports/restaurant-service-lcov.info
          cp backend/order-service/coverage/lcov.info coverage-reports/order-service-lcov.info

      - name: Upload cobertura LCOV
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage-reports/
          if-no-files-found: error

  frontend-ci:
    name: Frontend — Lint e Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint e build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  sonar-analysis:
    name: SonarCloud — Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download cobertura backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
