# SonarCloud — ajuste projectKey/organization após criar o projeto em https://sonarcloud.io
# Exemplo: Analyze new project → repositório ProjetoJeofton → With GitHub Actions
sonar.projectKey=RamonSFR_ProjetoJeofton
sonar.organization=RamonSFR

sonar.projectName=ProjetoJeofton
sonar.projectVersion=0.1.0

sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.sourceEncoding=UTF-8

# Excluir gerados, testes e dependências
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.integration.test.ts,**/prisma/migrations/**,**/package-lock.json
sonar.test.inclusions=**/*.test.ts,**/*.integration.test.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.integration.test.ts,**/server.ts,**/logger.ts

# Relatórios LCOV gerados pelo Jest (artefatos do job backend-ci)
sonar.javascript.lcov.reportPaths=coverage-reports/user-service-lcov.info,coverage-reports/restaurant-service-lcov.info,coverage-reports/order-service-lcov.info
